[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipa-voice-gate"
version = "0.1.0"
description = "Consequence gate + verifiable receipts for a self-checking voice agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sipa-voice-gate-verify = "sipa_voice_gate.verifier:main"

[tool.setuptools]
packages = ["sipa_voice_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
